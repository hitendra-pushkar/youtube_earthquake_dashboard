# The main pipeline for youtube_earthquake_bundle

resources:
  pipelines:
    youtube_earthquake_bundle_etl:
      name: Bronze_To_Silver_YEDPip_Prod
      configuration:
        catalog_name: ${var.catalog}
      libraries:
        - glob:
            include: ../src/DLT_pipeline/Bronze_To_Silver_YEDPip/transformations/**
      schema: silver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      root_path: ../src/DLT_pipeline/Bronze_To_Silver_YEDPip