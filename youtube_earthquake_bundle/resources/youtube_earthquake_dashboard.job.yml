resources:
  jobs:
    youtube_earthquake_dashboard_job:
      name: youtube_earthquake_dashboard_job
      tasks:
        - task_key: Ingestion_Bronze_YEDJ
          notebook_task:
            notebook_path: ../src/notebook/Ingestion_To_Bronze.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: Bronze_To_Silver_YED
          depends_on:
            - task_key: Ingestion_Bronze_YEDJ
          pipeline_task:
            pipeline_id: ${resources.pipelines.youtube_earthquake_bundle_etl.id}
        - task_key: Dashboard_YED
          depends_on:
            - task_key: Bronze_To_Silver_YED
          dashboard_task:
            subscription: {}
            warehouse_id: fa4c3cdbe539d618
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED