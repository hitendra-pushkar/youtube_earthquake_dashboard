name: Deploy Databricks Asset Bundle

on: 
  push: 
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Asset Bundle
        user: hitendra-kumar
        with:
          working-directory: ./youtube_earthquake_bundle
          databricks-host: https://dbc-d1b02804-095f.cloud.databricks.com
          databricks-bundle-env: prod
          authentication-type: token
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
        
